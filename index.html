<script>
(function () {
  function R() { return window.__resources || null; }
  function fix(el) {
    var m = R(); if (!m || !el || el.nodeType !== 1) return;
    if (el.tagName === "IMG") { var s = el.getAttribute("src"); if (s && m[s]) el.setAttribute("src", m[s]); }
    var st = el.getAttribute("style");
    if (st && st.indexOf("assets/") > -1) {
      var out = st.replace(/assets\/[^)'"\s]+/g, function (u) { return m[u] || u; });
      if (out !== st) el.setAttribute("style", out);
    }
  }
  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    var l = root.querySelectorAll("img,[style]");
    for (var i = 0; i < l.length; i++) fix(l[i]);
  }
  var mo = new MutationObserver(function (muts) {
    if (!R()) return;
    for (var i = 0; i < muts.length; i++) {
      var mu = muts[i];
      if (mu.type === "attributes") fix(mu.target);
      else for (var j = 0; j < mu.addedNodes.length; j++) scan(mu.addedNodes[j]);
    }
  });
  function start() {
    scan(document.body);
    mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src", "style"] });
  }
  if (document.body) start(); else document.addEventListener("DOMContentLoaded", start);
})();
</script>

<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">

<div dir="{{ dir }}" lang="{{ lang }}" style="background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); min-height: 100vh; position: relative; padding-bottom: 96px;">

  <!-- ══ BRIDGE ══ one mount per screen, only the active one rendered, so the
       flow remounts on its start-screen instead of keeping stale state ══ -->
  <sc-if value="{{ bHome }}" hint-placeholder-val="{{ true }}">
    <div><dc-import name="BridgeShop" view="responsive" start-screen="home" on-sign-in="{{ toBridgeLogin }}" on-search="{{ toBridgeSearch }}" on-journal="{{ toBridgeJournal }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ bPlp }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeShop" view="responsive" start-screen="plp" initial-type="{{ plpType }}" on-sign-in="{{ toBridgeLogin }}" on-search="{{ toBridgeSearch }}" on-journal="{{ toBridgeJournal }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ bProduct }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeShop" view="responsive" start-screen="product" on-sign-in="{{ toBridgeLogin }}" on-search="{{ toBridgeSearch }}" on-journal="{{ toBridgeJournal }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ bCheckout }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeShop" view="responsive" start-screen="checkout" on-sign-in="{{ toBridgeLogin }}" on-search="{{ toBridgeSearch }}" on-journal="{{ toBridgeJournal }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ bConfirmed }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeShop" view="responsive" start-screen="confirmed" on-sign-in="{{ toBridgeLogin }}" on-search="{{ toBridgeSearch }}" on-journal="{{ toBridgeJournal }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>

  <sc-if value="{{ atBridgeSearch }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeSearch" view="responsive" initial-query="{{ seedQuery }}" on-exit="{{ toBridgeShopDest }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ atBridgeLogin }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeLogin" view="responsive" on-exit="{{ toBridgeExit }}" on-create="{{ toBridgeAccount }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ atBridgeAccount }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeAccount" view="responsive" on-exit="{{ toBridgeExit }}" on-sign-in="{{ toBridgeLogin }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ atBridgeJournal }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="BridgeJournal" view="responsive" on-exit="{{ toBridgeExit }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>

  <!-- ══ SHIFT ══ -->
  <sc-if value="{{ atShiftHome }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftHome" on-shop="{{ toShiftShop }}" on-sign-in="{{ toShiftLogin }}" on-account="{{ toShiftAccount }}" on-search="{{ toShiftSearch }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>

  <sc-if value="{{ sPlp }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftShop" view="responsive" start-screen="plp" on-sign-in="{{ toShiftLogin }}" on-newsletter="{{ toShiftNotices }}" on-home="{{ toShiftHome }}" on-search="{{ toShiftSearch }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ sProduct }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftShop" view="responsive" start-screen="product" on-sign-in="{{ toShiftLogin }}" on-newsletter="{{ toShiftNotices }}" on-home="{{ toShiftHome }}" on-search="{{ toShiftSearch }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ sCheckout }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftShop" view="responsive" start-screen="checkout" on-sign-in="{{ toShiftLogin }}" on-newsletter="{{ toShiftNotices }}" on-home="{{ toShiftHome }}" on-search="{{ toShiftSearch }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ sConfirmed }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftShop" view="responsive" start-screen="confirmed" on-sign-in="{{ toShiftLogin }}" on-newsletter="{{ toShiftNotices }}" on-home="{{ toShiftHome }}" on-search="{{ toShiftSearch }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>

  <sc-if value="{{ atShiftSearch }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftSearch" on-exit="{{ toShiftShopDest }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>

  <sc-if value="{{ atShiftLogin }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftLogin" on-exit="{{ toShiftExit }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ atShiftAccount }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftAccount" on-exit="{{ toShiftExit }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>
  <sc-if value="{{ atShiftNotices }}" hint-placeholder-val="{{ false }}">
    <div><dc-import name="ShiftNotices" on-exit="{{ toShiftExit }}" hint-size="100%,100vh"></dc-import></div>
  </sc-if>

  <!-- ══ FLOATING DEMO NAV — present on every screen of both brands.
       Desktop: fixed panel. Mobile: collapses to a small pill that opens the
       same picker as a bottom sheet, so it never eats phone screen space. ══ -->
  <sc-if value="{{ navFull }}" hint-placeholder-val="{{ true }}">
    <div dir="ltr" data-brand="bridge" class="elev-lg" style="position: fixed; inset-inline-start: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; border: 1px solid var(--color-divider); background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); max-width: calc(100vw - 40px);">
      <div style="display: flex; align-items: stretch; border-bottom: 1px solid var(--color-divider);">
        <div style="padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; border-inline-end: 1px solid var(--color-divider);">
          <span style="font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700);">Prototype</span>
          <span style="font-family: var(--font-heading); font-weight: 800; font-size: 12px; white-space: nowrap;">{{ whereLabel }}</span>
        </div>
        <sc-for list="{{ brandTabs }}" as="bt" hint-placeholder-count="2">
          <button onClick="{{ bt.go }}" style="{{ bt.style }}">{{ bt.label }}</button>
        </sc-for>
        <div style="border-inline-start: 1px solid var(--color-divider); display: flex; align-items: center; padding: 0 12px;">
          <dc-import name="LocalePicker" variant="trigger" tone="light" device="desktop" hint-size="150px,24px"></dc-import>
        </div>
      </div>
      <div style="display: flex; align-items: stretch; flex-wrap: wrap;">
        <sc-for list="{{ screenTabs }}" as="st" hint-placeholder-count="8">
          <button onClick="{{ st.go }}" style="{{ st.style }}">{{ st.label }}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ navCompact }}" hint-placeholder-val="{{ false }}">
    <div dir="ltr" data-brand="bridge" style="font-family: var(--font-body);">
      <button onClick="{{ toggleNavOpen }}" class="elev-lg" style="position: fixed; inset-inline-start: 12px; bottom: 12px; z-index: 200; appearance: none; cursor: pointer; border: 1px solid var(--color-divider); background: var(--color-text); color: var(--color-bg); font: inherit; display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 44px; border-radius: 999px;">
        <span style="font-family: var(--font-heading); font-weight: 800; font-size: 12px; white-space: nowrap;">{{ whereLabel }}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" style="{{ navCaret }}"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeNavOpen }}" style="position: fixed; inset: 0; z-index: 199; background: rgba(32,30,29,0.5);">
          <div onClick="{{ stopNavClick }}" class="elev-lg" style="position: absolute; inset-inline: 0; bottom: 0; max-height: 70vh; overflow-y: auto; background: var(--color-bg); color: var(--color-text); border-top: 1px solid var(--color-divider); display: flex; flex-direction: column;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-divider);">
              <div>
                <span style="font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700); display: block;">Prototype</span>
                <span style="font-family: var(--font-heading); font-weight: 800; font-size: 13px;">{{ whereLabel }}</span>
              </div>
              <button onClick="{{ closeNavOpen }}" aria-label="Close" class="btn btn-icon btn-ghost" style="min-width: 44px; min-height: 44px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
            </div>
            <div style="display: flex; border-bottom: 1px solid var(--color-divider);">
              <sc-for list="{{ brandTabs }}" as="bt" hint-placeholder-count="2">
                <button onClick="{{ bt.go }}" style="{{ bt.mobileStyle }}">{{ bt.label }}</button>
              </sc-for>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--color-divider);">
              <sc-for list="{{ screenTabs }}" as="st" hint-placeholder-count="8">
                <button onClick="{{ st.go }}" style="{{ st.mobileStyle }}">{{ st.label }}</button>
              </sc-for>
            </div>
            <div style="padding: 14px 16px; border-top: 1px solid var(--color-divider);">
              <dc-import name="LocalePicker" variant="trigger" tone="light" device="mobile" hint-size="150px,24px"></dc-import>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const BRIDGE_SCREENS = [
  ['home', 'Home'],
  ['plp', 'Listing'],
  ['product', 'Product'],
  ['checkout', 'Checkout'],
  ['confirmed', 'Confirmed'],
  ['search', 'Search'],
  ['login', 'Sign in'],
  ['account', 'Account'],
  ['journal', 'Journal'],
];

const SHIFT_SCREENS = [
  ['home', 'Home'],
  ['plp', 'Pre-owned'],
  ['product', 'Product'],
  ['checkout', 'Checkout'],
  ['confirmed', 'Confirmed'],
  ['search', 'Search'],
  ['login', 'Sign in'],
  ['account', 'Record'],
  ['notices', 'Drop notices'],
];

const ROUTES = {
  'BridgeShop.dc.html': ['bridge', 'home'],
  'BridgeSearch.dc.html': ['bridge', 'search'],
  'BridgeLogin.dc.html': ['bridge', 'login'],
  'BridgeAccount.dc.html': ['bridge', 'account'],
  'BridgeJournal.dc.html': ['bridge', 'journal'],
  'ShiftHome.dc.html': ['shift', 'home'],
  'ShiftShop.dc.html': ['shift', 'plp'],
  'ShiftSearch.dc.html': ['shift', 'search'],
  'ShiftLogin.dc.html': ['shift', 'login'],
  'ShiftAccount.dc.html': ['shift', 'account'],
  'ShiftNotices.dc.html': ['shift', 'notices'],
};

class Component extends DCLogic {
  state = { brand: 'bridge', screen: 'home', seedQuery: '', plpType: '', localeTick: 0, navOpen: false };

  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
    const attach = () => {
      const s = window.BridgeLocale;
      if (!s) { this._lRetry = setTimeout(attach, 60); return; }
      this._lUnsub = s.subscribe(() => this.setState({ localeTick: this.state.localeTick + 1 }));
      this.setState({ localeTick: this.state.localeTick + 1 });
    };
    attach();

    // Any in-prototype link that would leave the page is routed to the matching
    // screen instead, so the demo nav is never lost mid-flow.
    this._click = (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || a.target === '_blank') return;
      const raw = a.getAttribute('href') || '';
      const [filePart, queryPart] = raw.split('#')[0].split('?');
      const dest = ROUTES[filePart];
      if (!dest) return;
      e.preventDefault();
      const typeMatch = /(?:^|&)type=([a-z]+)/.exec(queryPart || '');
      this.jump(dest[0], dest[1], undefined, typeMatch ? typeMatch[1] : '');
    };
    document.addEventListener('click', this._click, true);
  }
  componentWillUnmount() {
    clearTimeout(this._lRetry);
    if (this._lUnsub) this._lUnsub();
    document.removeEventListener('click', this._click, true);
    window.removeEventListener('resize', this.onResize);
  }

  jump(brand, screen, seed, plpType) {
    this.setState({
      brand: brand,
      screen: screen,
      seedQuery: typeof seed === 'string' ? seed : '',
      plpType: typeof plpType === 'string' ? plpType : '',
      navOpen: false,
    });
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  tabStyle(on) {
    return 'appearance: none; cursor: pointer; font: inherit;'
      + ' font-family: var(--font-heading); font-weight: 800; font-size: 12px;'
      + ' padding: 9px 13px; min-height: 38px; white-space: nowrap; border: 0;'
      + ' border-inline-start: 1px solid var(--color-divider);'
      + (on
        ? ' background: var(--color-text); color: var(--color-bg);'
        : ' background: transparent; color: var(--color-accent);');
  }

  mobileTabStyle(on) {
    return 'appearance: none; cursor: pointer; font: inherit;'
      + ' font-family: var(--font-heading); font-weight: 800; font-size: 13px;'
      + ' padding: 12px; min-height: 48px; border: 0; text-align: center;'
      + (on
        ? ' background: var(--color-text); color: var(--color-bg);'
        : ' background: var(--color-bg); color: var(--color-accent);');
  }

  renderVals() {
    const s = this.state;
    const store = window.BridgeLocale;
    const loc = store ? store.get() : { dir: 'ltr', languageCode: 'en' };
    const isBridge = s.brand === 'bridge';
    const list = isBridge ? BRIDGE_SCREENS : SHIFT_SCREENS;
    const label = (list.filter((r) => r[0] === s.screen)[0] || list[0])[1];
    const shopScreens = ['home', 'plp', 'product', 'checkout', 'confirmed'];

    return {
      dir: loc.dir,
      lang: loc.languageCode,
      whereLabel: (isBridge ? 'Bridge' : 'SHIFT') + ' · ' + label,

      navFull: (s.vw || (typeof window !== 'undefined' ? window.innerWidth : 1024)) >= 640,
      navCompact: (s.vw || (typeof window !== 'undefined' ? window.innerWidth : 1024)) < 640,
      navOpen: s.navOpen,
      navCaret: 'transform: ' + (s.navOpen ? 'rotate(180deg)' : 'rotate(0deg)') + '; transition: transform 180ms ease;',
      toggleNavOpen: () => this.setState({ navOpen: !this.state.navOpen }),
      closeNavOpen: () => this.setState({ navOpen: false }),
      stopNavClick: (e) => e.stopPropagation(),

      bHome: isBridge && s.screen === 'home',
      bPlp: isBridge && s.screen === 'plp',
      bProduct: isBridge && s.screen === 'product',
      bCheckout: isBridge && s.screen === 'checkout',
      bConfirmed: isBridge && s.screen === 'confirmed',

      sPlp: !isBridge && s.screen === 'plp',
      sProduct: !isBridge && s.screen === 'product',
      sCheckout: !isBridge && s.screen === 'checkout',
      sConfirmed: !isBridge && s.screen === 'confirmed',

      atBridgeSearch: isBridge && s.screen === 'search',
      atBridgeLogin: isBridge && s.screen === 'login',
      atBridgeAccount: isBridge && s.screen === 'account',
      atBridgeJournal: isBridge && s.screen === 'journal',

      atShiftHome: !isBridge && s.screen === 'home',
      atShiftSearch: !isBridge && s.screen === 'search',
      atShiftLogin: !isBridge && s.screen === 'login',
      atShiftAccount: !isBridge && s.screen === 'account',
      atShiftNotices: !isBridge && s.screen === 'notices',

      seedQuery: s.seedQuery,
      plpType: s.plpType,

      brandTabs: [
        { label: 'Bridge', style: this.tabStyle(isBridge), mobileStyle: this.mobileTabStyle(isBridge), go: () => this.jump('bridge', 'home') },
        { label: 'SHIFT', style: this.tabStyle(!isBridge), mobileStyle: this.mobileTabStyle(!isBridge), go: () => this.jump('shift', 'home') },
      ],
      screenTabs: list.map((r) => ({
        label: r[1],
        style: this.tabStyle(s.screen === r[0]),
        mobileStyle: this.mobileTabStyle(s.screen === r[0]),
        go: () => this.jump(s.brand, r[0]),
      })),

      toBridgeHome: () => this.jump('bridge', 'home'),
      toBridgeLogin: () => this.jump('bridge', 'login'),
      toBridgeAccount: () => this.jump('bridge', 'account'),
      toBridgeJournal: () => this.jump('bridge', 'journal'),
      toShiftAccount: () => this.jump('shift', 'account'),
      toBridgeSearch: (term) => this.jump('bridge', 'search', term),
      toBridgeShopDest: (dest) => this.jump('bridge', shopScreens.indexOf(dest) >= 0 ? dest : 'home'),
      toBridgeExit: (dest) => {
        if (dest === 'journal') { this.jump('bridge', 'journal'); return; }
        if (dest === 'search') { this.jump('bridge', 'search'); return; }
        if (dest === 'signin') { this.jump('bridge', 'login'); return; }
        if (dest === 'men' || dest === 'women' || dest === 'accessories') { this.jump('bridge', 'plp'); return; }
        this.jump('bridge', shopScreens.indexOf(dest) >= 0 ? dest : 'home');
      },

      toShiftHome: (dest) => this.jump('shift', 'home'),
      toShiftShop: (dest) => this.jump('shift', dest === 'checkout' ? 'checkout' : 'plp'),
      toShiftShopDest: (dest) => this.jump('shift', dest === 'signin' ? 'login' : dest === 'checkout' ? 'checkout' : 'plp'),
      toShiftSearch: (term) => this.jump('shift', 'search', term),
      toShiftLogin: () => this.jump('shift', 'login'),
      toShiftNotices: () => this.jump('shift', 'notices'),
      toShiftExit: (dest) => {
        if (dest === 'search') { this.jump('shift', 'search'); return; }
        if (dest === 'checkout') { this.jump('shift', 'checkout'); return; }
        if (dest === 'signin') { this.jump('shift', 'login'); return; }
        if (dest === 'account') { this.jump('shift', 'account'); return; }
        if (dest === 'plp') { this.jump('shift', 'plp'); return; }
        this.jump('shift', 'home');
      },
    };
  }
}
</script>
</body>
</html>
